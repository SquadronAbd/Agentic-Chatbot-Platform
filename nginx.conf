events {}

http {
    upstream frontend { server frontend:3000; }
    upstream backend  { server chatbot_backend:8000; }
    upstream agentic  { server agentic_service:8000; }

    server {
        listen 80;

        # WebSocket upgrade for chat stream — must be declared before /api/v1/
        location /api/v1/chat/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Agentic service (ingest, chat, evaluate, search)
        location /agentic/ {
            proxy_pass http://agentic/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 50m;
        }

        # All other backend API calls
        location /api/v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Everything else to the Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
